[project]
name = "verbatim-rag"
version = "0.1.0"
description = "Small demo of verbatim RAG: retrieve, rerank, and highlight exact evidence spans"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "lancedb>=0.41.0",
    "peft>=0.15.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
extend-exclude = [".agents"]
